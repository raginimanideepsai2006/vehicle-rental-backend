server.port=${PORT:8080}

# Database Configuration (Defaults to H2 in-memory if no external cloud DB is configured)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vehiclerental_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.vehiclerental=INFO
logging.level.org.springframework.security=WARN
